services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: marvel-cpg-dashboard
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000')"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
