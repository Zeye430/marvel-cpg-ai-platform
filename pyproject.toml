[project]
name = "marvel-cpg-ai-platform"
version = "0.1.0"
description = "AI-powered commercial execution platform for the Marvel CPG course project."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "duckdb==1.5.6",
    "matplotlib==3.10.9",
    "numpy==2.3.5",
    "pandas==2.3.3",
    "seaborn==0.13.2",
]

[project.optional-dependencies]
# Offline Module 2 modelling, evaluation and scoring.
module2 = [
    "joblib==1.4.2",
    "lightgbm==4.6.0",
    "optuna==4.6.0",
    "pyarrow==24.0.0",
    "scikit-learn==1.6.1",
    "xgboost==3.1.2",
]
# Shiny application runtime (mirrors requirements.txt for the local app).
app = [
    "anywidget",
    "plotly==5.24.1",
    "psycopg2-binary>=2.9.9",
    "python-dotenv>=1.0.0",
    "shiny>=1.0",
    "shinywidgets",
    "sqlalchemy>=2.0.0",
]

[dependency-groups]
dev = [
    "ipykernel==7.3.0",
    "jupyterlab==4.6.4",
]
